name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar contratos generados
        run: npm run contracts:check

      - name: Compilar
        run: npm run build

      - name: Verificar lint
        run: npm run lint

      - name: Probar
        run: npm test
