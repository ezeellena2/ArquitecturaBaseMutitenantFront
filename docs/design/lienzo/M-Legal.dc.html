<!doctype html>
<html lang="es">
<head>

<title>Documento legal en el teléfono</title>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root { --t1: oklch(0.24 0.014 78); --t2: oklch(0.46 0.014 78); --t3: oklch(0.6 0.01 78); --borde: oklch(0.91 0.007 78); --borde2: oklch(0.83 0.01 78); --fondo: oklch(0.975 0.003 78); --s2: oklch(0.975 0.003 78); --s3: oklch(0.95 0.004 78); --marca: oklch(0.51 0.099 195); --marca-h: oklch(0.46 0.099 195); --marca-t: oklch(0.96 0.021 78); --marca-tx: oklch(0.42 0.093 195); --peligro: oklch(0.57 0.2 25); --peligro-t: oklch(0.97 0.02 25); --ok: oklch(0.44 0.12 155); --ok-t: oklch(0.95 0.05 155); --alerta: oklch(0.5 0.12 70); --alerta-t: oklch(0.96 0.06 85); }
    body { margin: 0; background: var(--fondo); -webkit-font-smoothing: antialiased; font-family: Inter, system-ui, sans-serif; }
    button, input, textarea, select { font-family: inherit; }
    .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .brand { display: block; width: 32px; height: 32px; border-radius: 9px; background: var(--marca); }
    .avatar { display: inline-flex; width: 32px; height: 32px; align-items: center; justify-content: center; border-radius: 999px; background: var(--marca); color: #fff; font-size: 14px; font-weight: 600; flex-shrink: 0; }
    .avatar.gris { background: var(--s3); color: var(--t2); }
    .icon-btn { display: inline-flex; width: 36px; height: 36px; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: var(--t2); cursor: pointer; }
    .icon-btn:hover { background: var(--s3); color: var(--t1); }
    .scope { border-bottom: 1px solid var(--borde); padding: 14px 12px; }
    .scope-name { margin: 0; font-size: 15px; line-height: 20px; font-weight: 600; color: var(--t1); }
    .scope-detail { margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--t3); }

    /* Página */
    .pagina { padding: 28px 32px 24px; display: flex; flex-direction: column; gap: 20px; font-size: 14px; line-height: 1.5; color: var(--t1); }
    .ph { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .ph h1, .hero h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; color: var(--t1); }
    .ph .res { margin: 6px 0 0; font-size: 14px; color: var(--t2); }
    .ph .tit { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .sucio { font-size: 14px; color: var(--alerta); font-weight: 500; }
    .acciones { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .b { height: 40px; box-sizing: border-box; padding: 0 18px; border-radius: 10px; border: 1px solid transparent; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; text-decoration: none; white-space: nowrap; }
    .b-pri { background: var(--marca); color: #fff; }
    .b-pri:hover { background: var(--marca-h); }
    .b-sec { background: #fff; border-color: var(--borde); color: var(--t1); }
    .b-sec:hover { border-color: var(--borde2); background: var(--s2); }
    .b-pel { background: var(--peligro); color: #fff; }
    .b-gho { background: transparent; color: var(--t2); }
    .b-gho:hover { background: var(--s3); color: var(--t1); }
    .b-lg, .b.lg { height: 48px; padding: 0 22px; font-size: 15px; border-radius: 12px; }
    .b-full { width: 100%; }
    .b:disabled { opacity: 0.5; cursor: default; }
    .lnk { border: 0; background: transparent; padding: 0; font-size: inherit; font-weight: 600; color: var(--marca-tx); cursor: pointer; text-decoration: none; }
    .lnk:hover { text-decoration: underline; text-underline-offset: 3px; }
    .lnk:disabled { color: var(--t3); cursor: default; text-decoration: none; font-weight: 500; }

    /* Barra de filtros */
    .fb { background: #fff; border: 1px solid var(--borde); border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .fb-bus { position: relative; flex: 1 1 280px; max-width: 360px; }
    .fb-bus input { width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px 0 38px; border: 1px solid var(--borde); border-radius: 10px; background: var(--s2); font-size: 14px; color: var(--t1); }
    .fb-bus input::placeholder { color: var(--t3); }
    .fb-bus input:focus { outline: none; border-color: var(--marca); background: #fff; box-shadow: 0 0 0 3px oklch(0.51 0.099 195 / 0.15); }
    .fb-bus svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--t3); pointer-events: none; }
    .envoltura { position: relative; }
    .pill-sel { height: 40px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; border: 1px solid var(--borde); background: #fff; font-size: 14px; color: var(--t2); display: inline-flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; }
    .pill-sel:hover { border-color: var(--borde2); }
    .pill-sel.con { color: var(--marca-tx); border-color: oklch(0.51 0.099 195 / 0.35); background: var(--marca-t); font-weight: 500; }
    .fb-limpiar { border: 0; background: transparent; font-size: 14px; color: var(--t3); cursor: pointer; padding: 8px 10px; border-radius: 8px; }
    .fb-limpiar:hover { color: var(--t1); background: var(--s2); }
    .fb-der { margin-left: auto; display: flex; align-items: center; gap: 10px; }

    /* Menús: filtros, ⋮ de las filas y menú del usuario */
    .menu { position: absolute; z-index: 20; top: calc(100% + 6px); background: #fff; border: 1px solid var(--borde); border-radius: 12px; box-shadow: 0 12px 32px oklch(0.24 0.014 78 / 0.14); padding: 6px; min-width: 220px; display: flex; flex-direction: column; }
    .menu.izq { left: 0; }
    .menu.der { right: 0; }
    .menu.arriba { top: auto; bottom: calc(100% + 6px); }
    .menu-it { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 8px 12px; border: 0; border-radius: 8px; background: transparent; font-size: 14px; color: var(--t1); cursor: pointer; text-align: left; width: 100%; box-sizing: border-box; text-decoration: none; white-space: nowrap; }
    .menu-it:hover { background: var(--s2); }
    .menu-it.on { background: var(--marca-t); color: var(--marca-tx); font-weight: 500; }
    .menu-it svg { color: var(--t3); flex-shrink: 0; }
    .menu-it:hover svg { color: var(--t1); }
    .menu-it.pel, .menu-it.pel svg { color: var(--peligro); }
    .menu-it.pel:hover { background: var(--peligro-t); }
    .menu-it.apagado { color: var(--t3); cursor: default; }
    .menu-it.apagado:hover { background: transparent; }
    .menu-sep { height: 1px; background: var(--borde); margin: 4px 0; }
    .menu-cnt { margin-left: auto; padding-left: 16px; font-size: 13px; color: var(--t3); font-variant-numeric: tabular-nums; }
    .menu-tit { padding: 8px 12px 4px; font-size: 13px; font-weight: 600; color: var(--t3); }
    .menu-cab { display: flex; align-items: center; gap: 12px; padding: 10px 12px; }
    .menu-cab .n1 { font-size: 15px; font-weight: 600; color: var(--t1); }
    .menu-cab .n2 { font-size: 13px; color: var(--t2); }
    .perfil-t { display: flex; flex-direction: column; min-width: 0; flex-grow: 1; line-height: 1.3; }
    .perfil-t .n1 { font-size: 14px; font-weight: 500; color: var(--t1); overflow: hidden; text-overflow: ellipsis; }
    .perfil-t .n2 { font-size: 13px; color: var(--t3); }
    .ico-perfil { width: 32px; height: 32px; border-radius: 9px; background: var(--s3); color: var(--t2); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 13px; font-weight: 700; }
    .menu-it.on .ico-perfil { background: #fff; color: var(--marca-tx); }
    .capa { position: absolute; inset: 0; z-index: 15; border: 0; padding: 0; background: transparent; cursor: default; }

    /* Botón del usuario en la barra superior */
    .um-btn { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px 0 6px; border: 1px solid transparent; border-radius: 12px; background: transparent; cursor: pointer; text-align: left; }
    .um-btn:hover, .um-btn[aria-expanded="true"] { background: #fff; border-color: var(--borde); }
    .um-txt { display: flex; flex-direction: column; line-height: 1.25; }
    .um-txt .n1 { font-size: 14px; font-weight: 600; color: var(--t1); }
    .um-txt .n2 { font-size: 13px; color: var(--t2); }
    .um-btn > svg { color: var(--t3); }
    .ab-topbar { height: 64px; }

    /* Tablas */
    .tarjeta { background: #fff; border: 1px solid var(--borde); border-radius: 14px; box-shadow: 0 1px 2px oklch(0.24 0.014 78 / 0.04); }
    .tt-h { display: grid; align-items: center; gap: 16px; height: 46px; padding: 0 20px; border-bottom: 1px solid var(--borde); font-size: 13px; font-weight: 600; color: var(--t2); white-space: nowrap; }
    .tt-h.gris { background: var(--s3); color: var(--t2); }
    .tt-h.azul-claro { background: oklch(0.95 0.021 78); color: var(--marca-tx); border-bottom-color: oklch(0.88 0.032 78); }
    .tt-h.azul { background: var(--marca); color: #fff; border-bottom-color: var(--marca); }
    .tarjeta > .tt-h:first-child { border-radius: 13px 13px 0 0; }
    .tt-f { display: grid; align-items: center; gap: 16px; min-height: 64px; padding: 10px 20px; box-sizing: border-box; border-bottom: 1px solid var(--borde); font-size: 14px; }
    .tt-f:hover { background: var(--s2); }
    .tt-f.nueva { background: var(--marca-t); }
    .tt-f > * { min-width: 0; }
    .c1 { display: block; font-weight: 500; color: var(--t1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .c1.n { font-weight: 400; }
    .c2 { display: block; font-size: 13px; color: var(--t3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    a.c1 { text-decoration: none; }
    a.c1:hover { color: var(--marca-tx); text-decoration: underline; text-underline-offset: 3px; }
    .num { font-variant-numeric: tabular-nums; color: var(--t1); text-align: right; }
    .tt-h .num { color: inherit; }
    .der { display: flex; justify-content: flex-end; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
    .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill.ok { background: var(--ok-t); color: var(--ok); }
    .pill.off { background: var(--s3); color: var(--t2); }
    .pill.pend { background: var(--marca-t); color: var(--marca-tx); }
    .pill.alerta { background: var(--alerta-t); color: var(--alerta); }
    .pill.mal { background: var(--peligro-t); color: var(--peligro); }
    .rol { display: inline-flex; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500; background: var(--s3); color: var(--t1); white-space: nowrap; }
    .rol.sis { background: var(--marca-t); color: var(--marca-tx); }
    .roles { display: flex; gap: 6px; flex-wrap: nowrap; overflow: hidden; }
    .kebab { width: 32px; height: 32px; box-sizing: border-box; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--t3); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    .kebab:hover, .kebab[aria-expanded="true"] { background: #fff; border-color: var(--borde); color: var(--t1); }
    .pie { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; font-size: 13px; color: var(--t2); }
    .pag { display: flex; align-items: center; gap: 10px; }
    .pag .pill-sel { height: 32px; font-size: 13px; padding: 0 12px; }
    .pag .ico-btn:disabled { opacity: 0.4; cursor: default; background: transparent; border-color: transparent; }
    .pie.centro { justify-content: center; }
    .vacio { padding: 48px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
    .vacio strong { font-size: 16px; font-weight: 600; color: var(--t1); }
    .vacio span { font-size: 14px; color: var(--t2); max-width: 420px; }

    /* Fichas */
    .volver2 { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--t2); text-decoration: none; align-self: flex-start; }
    .volver2:hover { color: var(--marca-tx); }
    .hero { background: #fff; border: 1px solid var(--borde); border-radius: 14px; padding: 24px; display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; }
    .hero .tit { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .hero .sub { margin-top: 8px; font-size: 15px; color: var(--t2); }
    .tabs2 { display: flex; gap: 6px; border-bottom: 1px solid var(--borde); }
    .tab2 { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 14px; font-weight: 500; color: var(--t2); background: var(--s2); border: 1px solid var(--borde); border-bottom-color: transparent; border-radius: 10px 10px 0 0; margin-bottom: -1px; cursor: pointer; }
    .tab2:hover { color: var(--t1); background: var(--s3); }
    .tab2[aria-selected="true"] { color: var(--marca-tx); background: #fff; border-top: 2px solid var(--marca); border-bottom-color: #fff; }
    .tab2 .cnt { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--s3); color: var(--t2); }
    .tab2[aria-selected="true"] .cnt { background: var(--marca-t); color: var(--marca-tx); }

    /* Formularios */
    .hoja { background: #fff; border: 1px solid var(--borde); border-radius: 14px; padding: 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 24px; }
    .hoja h2 { grid-column: 1 / -1; margin: 8px 0 -4px; font-size: 17px; font-weight: 600; color: var(--t1); }
    .hoja h2:first-child { margin-top: 0; }
    .hoja .linea { grid-column: 1 / -1; height: 1px; background: var(--borde); margin: 4px 0; }
    .campo2 { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .campo2.ancho { grid-column: 1 / -1; }
    .et { font-size: 13px; font-weight: 600; color: var(--t2); display: flex; align-items: center; gap: 8px; }
    .et .req { color: var(--peligro); margin-left: -6px; }
    .et .todos { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; color: var(--t2); cursor: pointer; }
    .et .todos input { width: 16px; height: 16px; margin: 0; accent-color: var(--marca); cursor: pointer; }
    .in2 { height: 44px; width: 100%; box-sizing: border-box; padding: 0 14px; border: 1px solid var(--borde); border-radius: 10px; background: #fff; font-size: 15px; color: var(--t1); }
    .in2::placeholder { color: var(--t3); }
    .in2:focus { outline: none; border-color: var(--marca); box-shadow: 0 0 0 3px oklch(0.51 0.099 195 / 0.15); }
    .in2.mal { border-color: var(--peligro); }
    .in2[readonly] { background: var(--s2); color: var(--t2); }
    textarea.in2 { height: auto; min-height: 88px; padding: 10px 14px; line-height: 1.5; resize: none; }
    button.in2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; text-align: left; }
    button.in2:disabled { background: var(--s2); color: var(--t2); cursor: default; }
    button.in2 .val { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vacio2 { color: var(--t3); }
    button.in2 svg { color: var(--t3); flex-shrink: 0; }
    .err2 { font-size: 13px; color: var(--peligro); }
    .lista { max-height: 300px; overflow-y: auto; left: 0; right: auto; min-width: 100%; width: max-content; max-width: 400px; box-sizing: border-box; }
    .op2 { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 0; border-radius: 8px; background: transparent; text-align: left; width: 100%; box-sizing: border-box; cursor: pointer; }
    .op2:hover { background: var(--s2); }
    .op2.on { background: var(--marca-t); }
    .op2 input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--marca); cursor: pointer; flex-shrink: 0; }
    .op2 .opn { display: block; font-size: 14px; font-weight: 500; color: var(--t1); }
    .op2 .opd { display: block; font-size: 13px; color: var(--t2); margin-top: 1px; }
    .fila-emp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) 44px; gap: 12px; align-items: start; }
    .quitar { width: 44px; height: 44px; box-sizing: border-box; border: 1px solid var(--borde); border-radius: 10px; background: #fff; color: var(--t3); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    .quitar:hover { color: var(--peligro); border-color: oklch(0.57 0.2 25 / 0.4); background: var(--peligro-t); }
    .sumar { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 4px 0; font-size: 14px; font-weight: 600; color: var(--marca-tx); cursor: pointer; }
    .aviso-linea { grid-column: 1 / -1; display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 10px; font-size: 14px; line-height: 1.5; }
    .aviso-linea.alerta { background: var(--alerta-t); color: oklch(0.4 0.1 70); }
    .aviso-linea.mal { background: var(--peligro-t); color: oklch(0.45 0.17 25); }
    .aviso-linea.info { background: var(--marca-t); color: var(--marca-tx); }
    .aviso-linea svg { flex-shrink: 0; margin-top: 2px; }

    /* Campo con prefijo (dirección pública) */
    .in-pre { display: flex; align-items: stretch; height: 44px; border: 1px solid var(--borde); border-radius: 10px; background: #fff; overflow: hidden; }
    .in-pre:focus-within { border-color: var(--marca); box-shadow: 0 0 0 3px oklch(0.51 0.099 195 / 0.15); }
    .in-pre.mal { border-color: var(--peligro); }
    .in-pre > span { display: inline-flex; align-items: center; padding: 0 12px; background: var(--s2); border-right: 1px solid var(--borde); font-size: 15px; color: var(--t2); white-space: nowrap; }
    .in-pre > input { flex: 1; min-width: 0; border: 0; outline: none; padding: 0 14px; font-size: 15px; color: var(--t1); background: transparent; }

    /* Inicio: indicadores, tarjetas con cabecera y pasos */
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .kpi { background: #fff; border: 1px solid var(--borde); border-radius: 14px; padding: 20px 24px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; }
    a.kpi:hover { border-color: var(--borde2); box-shadow: 0 4px 12px oklch(0.24 0.014 78 / 0.06); }
    .kpi .k { font-size: 13px; font-weight: 600; color: var(--t2); }
    .kpi .v { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; color: var(--t1); font-variant-numeric: tabular-nums; }
    .kpi .p { font-size: 13px; color: var(--t3); }
    .t-cab { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px; border-bottom: 1px solid var(--borde); }
    .t-cab h2 { margin: 0; font-size: 17px; font-weight: 600; color: var(--t1); }
    .t-cab .d { font-size: 14px; color: var(--t2); }
    .paso { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--borde); }
    .paso:last-child { border-bottom: 0; }
    .paso .ck { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--borde2); box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; color: #fff; }
    .paso.hecho .ck { background: var(--ok); border-color: var(--ok); }
    .paso.hecho .c1 { color: var(--t2); text-decoration: line-through; text-decoration-color: var(--t3); }
    .ico-btn { width: 32px; height: 32px; box-sizing: border-box; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--t3); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    .ico-btn:hover { background: #fff; border-color: var(--borde); color: var(--t1); }
    .cambios { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 10px 16px; font-size: 14px; }
    .cambios .k { color: var(--t2); font-weight: 500; }
    .cambios .antes { color: var(--t3); text-decoration: line-through; }

    /* Diálogos */
    .velo { position: absolute; inset: 0; z-index: 40; background: oklch(0.2 0.014 78 / 0.42); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; }
    .dlg { width: 640px; max-width: calc(100% - 32px); background: #fff; border-radius: 18px; box-shadow: 0 24px 48px oklch(0.2 0.014 78 / 0.22); display: flex; flex-direction: column; font-size: 14px; line-height: 1.5; color: var(--t1); }
    .dlg.chico { width: 460px; }
